name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild pages and confirm they match the committed output
        run: node scripts/build.mjs && git diff --exit-code -- dist
      - run: node scripts/check.mjs
      - name: Syntax-check every browser module
        run: for file in dist/js/*.js; do node --check "$file"; done
      - run: node --test scripts/site.test.mjs
      - run: git diff --check
