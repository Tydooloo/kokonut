name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - run: node --check dist/app.js
      - run: node --check dist/motion.mjs
      - run: node --test scripts/motion.test.mjs
      - run: git diff --check
